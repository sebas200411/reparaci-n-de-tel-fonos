<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar Mensaje</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>

  <main class="contenedor">
    <section class="tarjeta-contacto">

      <form id="formContacto">

        <div class="seccion-foto">
          <label class="etiqueta-foto">Foto de perfil</label>
          <div class="contenedor-preview">
            <img id="imgPreview" src="uploads/ana_torres.jpg" alt="Vista previa" class="foto-preview">
            <label for="inputFoto" class="btn-subir-foto">Seleccionar foto</label>
            <input type="file" id="inputFoto" accept="image/*" class="input-oculto">
          </div>
        </div>

        <div class="grupo-campo">
          <label for="nombre">Tu nombre</label>
          <input type="text" id="nombre" placeholder="Ej. Carlos Pérez" required>
        </div>

        <div class="grupo-campo">
          <label for="correo">Tu correo</label>
          <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="grupo-campo">
          <label for="mensaje">¿En qué te puede ayudar?</label>
          <textarea id="mensaje" rows="4" placeholder="Cuéntale sobre tu proyecto o idea..." required></textarea>
        </div>

        <button type="submit" class="btn-enviar">Guardar y Enviar</button>
        <a href="index.html" class="btn-volver">Volver al Perfil</a>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
