<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="contenedor">
    <section class="tarjeta-perfil">
      <div class="encabezado-perfil">
        <img id="fotoPerfil" src="uploads/ana_torres.jpg" alt="Foto de perfil" class="foto-perfil">
        <div class="datos-personales">
          <h2 id="nombrePerfil">Ana Torres</h2>
          <span class="cargo">Desarrolladora Web</span>
        </div>
      </div>

      <p class="descripcion">
        Desarrolladora web apasionada por crear experiencias digitales modernas, accesibles y fáciles de utilizar.
      </p>

      <div class="estadisticas">
        <div class="stat-item">
          <span class="numero">24</span>
          <span class="etiqueta">Proyectos</span>
        </div>
        <div class="stat-item">
          <span class="numero">1.8K</span>
          <span class="etiqueta">Seguidores</span>
        </div>
        <div class="stat-item">
          <span class="numero">5</span>
          <span class="etiqueta">Años</span>
        </div>
      </div>

      <a href="index1.html" class="btn-contactar">Contactar</a>
    </section>
  </main>

  <script src="perfil.js"></script>
</body>

</html>
